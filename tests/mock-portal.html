<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Nachbau PortalPlus (Test)</title>
<!-- dieselben Bibliotheken wie portal.portalplus.bayern -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous">
<link href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js" integrity="sha384-w76AqPfDkMBDXo30jS1Sgez6pr3x5MlQ1ZAGC+nuZB+EYdgRZgiwxhTBTkF7CXvN" crossorigin="anonymous"></script>
<script src="https://code.jquery.com/jquery-3.6.3.min.js" integrity="sha256-pvPw+upLPUjgMXY0G+8O0xUf+/Im1MZjXxxgOcBQBXU=" crossorigin="anonymous"></script>
<script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js" integrity="sha256-lSjKY0/srUM9BE3dPm+c4fBo1dky2v27Gdjm2uoZaL0=" crossorigin="anonymous"></script>
</head>
<body class="text-center">
<nav class="p-2 border-bottom text-start">
  <button class="btn btn-sm btn-outline-primary" id="navInvoice" onclick="loadTpl('rechnung')">Rechnung</button>
  <button class="btn btn-sm btn-outline-primary" id="navFibu" onclick="loadTpl('fibu')">Buchung</button>
  <button class="btn btn-sm btn-outline-secondary" onclick="$('#content').empty()">Leeren</button>
</nav>
<div id="content" class="container text-start py-3"></div>

<script>
  window.appLog = [];
  $.datepicker.setDefaults({
    dateFormat: 'dd.mm.yy', firstDay: 1,
    dayNamesMin: ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'],
    monthNames: ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember']
  });

  const row = (label, field) =>
    `<div class="row mb-2"><label class="col-sm-3 col-form-label">${label}</label><div class="col-sm-9">${field}</div></div>`;

  const TPL = {
    rechnung: `<form id="formInvoice">
      <h5>Rechnung erstellen</h5>
      ${row('Rechnungsdatum', '<input class="form-control datepicker" name="invoiceDate">')}
      ${row('Lieferdatum', '<input class="form-control datepicker" name="deliveryDate">')}
      ${row('Fällig am', '<input type="date" class="form-control" name="dueDate">')}
      ${row('Uhrzeit', '<input type="time" class="form-control" name="time">')}
      ${row('Belegdatum', '<div class="input-group"><input class="form-control" name="docDate"><span class="input-group-text">📅</span></div>')}
      ${row('Wareneingang', '<input class="form-control" name="wareIn" placeholder="TT.MM.JJJJ">')}
      ${row('Kunde', '<input class="form-control" name="customer">')}
      ${row('Rechnungsadresse', '<textarea class="form-control" name="billAddr" rows="2"></textarea>')}
      ${row('Lieferadresse', '<textarea class="form-control" name="shipAddr" rows="2"></textarea>')}
      ${row('Zahlungsart', '<select class="form-select" name="payment"><option value="">bitte wählen</option><option value="1">Überweisung</option><option value="2">Lastschrift</option></select>')}
      ${row('Zahlungsart (Text)', '<input class="form-control" name="paymentText">')}
      ${row('Dateiname', '<input class="form-control" name="fileName">')}
      <button type="button" class="btn btn-primary" name="save">Speichern</button>
    </form>`,
    fibu: `<div id="fibu">
      <h5>Buchungssatz</h5>
      <table class="table table-sm align-middle" style="table-layout:fixed">
        <thead><tr><th style="width:14%">Belegdatum</th><th style="width:14%">Buchungsdatum</th><th>Soll</th><th>Haben</th><th>Betrag Soll</th><th>Betrag Haben</th><th style="width:26%">Buchungstext</th></tr></thead>
        <tbody><tr>
          <td><input class="form-control form-control-sm datepicker" name="belegDatum"></td>
          <td><input class="form-control form-control-sm datepicker" name="buchDatum"></td>
          <td><input class="form-control form-control-sm" name="soll"></td>
          <td><input class="form-control form-control-sm" name="haben"></td>
          <td><input class="form-control form-control-sm" name="betragSoll"></td>
          <td><input type="number" step="0.01" class="form-control form-control-sm" name="betragHaben"></td>
          <td><input class="form-control form-control-sm" name="text"></td>
        </tr></tbody>
      </table>
    </div>`
  };

  // wie _getData() im Portal: HTML per AJAX holen und mit $(...).html() einsetzen, danach Datepicker initialisieren
  function loadTpl(name) {
    setTimeout(() => {
      $('#content').html(TPL[name]);
      $('#content .datepicker').datepicker();
      $('#content [name=docDate]').datepicker({ onSelect() { appLog.push('onSelect:' + this.value); } });
    }, 150);
  }
  $('#content').on('change', 'input, select, textarea', function () { appLog.push('change:' + this.name + '=' + this.value); });
  function collect() { const data = {}; $('#content :input').each(function () { data[this.name] = $(this).val(); }); return data; }
</script>
</body>
</html>
